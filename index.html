<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora - Centro Fotocopiado SS</title>
    
    <!-- Carga de Tailwind CSS para los estilos -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fuentes de Google -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- Carga de React y Babel para que funcione en un solo archivo -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- MAPA DE IMPORTACIÓN: Soluciona el error de pantalla blanca -->
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18",
          "react-dom/client": "https://esm.sh/react-dom@18/client",
          "react/jsx-runtime": "https://esm.sh/react@18/jsx-runtime"
        }
      }
    </script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import { Printer, Calculator, Camera, FileText, Layers, ShieldCheck, MessageCircle, Smartphone, HardDrive, Music, Video, Database, Package, Settings, Monitor, Wrench, RefreshCw, PenTool, LayoutTemplate, Palette, Folder, Book, Globe, UserCheck, Mail } from 'react';

        // Necesitamos importar los iconos directamente de la CDN de Lucide para que funcione en el navegador local
        const IconBase = ({ name, size = 24, className = '', color = 'currentColor' }) => {
            return (
                <i data-lucide={name} className={className} style={{ width: size, height: size, color: color, display: 'inline-block' }}></i>
            );
        };

        const App = () => {
          // Tasa del BCV con memoria local
          const [bcvRate, setBcvRate] = useState(() => {
            const savedRate = localStorage.getItem('centro_ss_bcvRate');
            return savedRate ? parseFloat(savedRate) : 36.00; // Valor inicial referencial
          });

          const [isFetchingRate, setIsFetchingRate] = useState(false);

          const fetchBCVRate = async () => {
            setIsFetchingRate(true);
            try {
                const response = await fetch('https://ve.dolarapi.com/v1/dolares/oficial');
                if (response.ok) {
                    const data = await response.json();
                    if (data && data.promedio) {
                        setBcvRate(data.promedio);
                        localStorage.setItem('centro_ss_bcvRate', data.promedio.toString());
                    }
                }
            } catch (error) {
                console.error("Error obteniendo tasa del BCV:", error);
            } finally {
                setIsFetchingRate(false);
            }
          };

          useEffect(() => {
            fetchBCVRate();
            // Cargar los iconos de Lucide una vez que el componente se monta
            const script = document.createElement('script');
            script.src = 'https://unpkg.com/lucide@latest';
            script.onload = () => lucide.createIcons();
            document.head.appendChild(script);
          }, []);

          useEffect(() => {
            localStorage.setItem('centro_ss_bcvRate', bcvRate.toString());
          }, [bcvRate]);

          // Datos de contacto y Rutas Locales
          const contactInfo = {
            phone: "+58 412-1969318",
            link: "https://bit.ly/Centro_Fotocopiado_SS"
          };
          const localLogoUrl = "./PRINTER CENTER (1).png";
          const localQrUrl = "./QR WhatsApp Centro Fotocopiado SS (041219699318).jpeg";

          const [services] = useState([
            // IMPRESIONES B/N
            { id: 1, name: 'Copia / Impresión B/N (Carta)', usd: 0.15, icon: 'file-text', category: 'Impresiones (Papel Normal)', iconClass: 'text-gray-700' },
            { id: 20, name: 'Copia / Impresión B/N (Oficio)', usd: 0.20, icon: 'file-text', category: 'Impresiones (Papel Normal)', iconClass: 'text-gray-700' },
            
            // IMPRESIONES COLOR MEDIO
            { id: 2, name: 'Copia / Impresión Color (Carta)', usd: 0.25, icon: 'file-text', category: 'Impresiones (Papel Normal)', iconClass: 'text-blue-500' },
            { id: 21, name: 'Copia / Impresión Color (Oficio)', usd: 0.30, icon: 'file-text', category: 'Impresiones (Papel Normal)', iconClass: 'text-blue-500' },
            
            // IMPRESIONES FULL COLOR
            { id: 4, name: 'Impresión Color Full (Carta)', usd: 0.50, icon: 'layers', category: 'Impresiones (Papel Normal)', iconClass: 'text-blue-600' },
            { id: 22, name: 'Impresión Color Full (Oficio)', usd: 0.60, icon: 'layers', category: 'Impresiones (Papel Normal)', iconClass: 'text-blue-600' },
            
            // IMPRESIONES PREMIUM (Agregado el Autoadhesivo Brillante)
            { id: 48, name: 'Stickers / Etiquetas A4 (Autoadhesivo Brillante)', usd: 2.50, icon: 'image', category: 'Impresiones Premium', iconClass: 'text-amber-500' },
            { id: 32, name: 'Impresión B/N (Cartulina Opalina)', usd: 0.50, icon: 'file-text', category: 'Impresiones Premium', iconClass: 'text-purple-600' },
            { id: 33, name: 'Impresión Color (Cartulina Opalina)', usd: 0.80, icon: 'file-text', category: 'Impresiones Premium', iconClass: 'text-purple-600' },
            { id: 34, name: 'Impresión Full Color (Opalina)', usd: 1.00, icon: 'layers', category: 'Impresiones Premium', iconClass: 'text-purple-700' },
            { id: 5, name: 'Fondo Negro (Papel Fotográfico)', usd: 2.00, icon: 'file-text', category: 'Impresiones Premium', iconClass: 'text-gray-900' },
            { id: 14, name: 'Foto Tamaño Carta (Papel Foto)', usd: 2.00, icon: 'camera', category: 'Impresiones Premium', iconClass: 'text-pink-600' },
            { id: 35, name: 'Foto Tamaño A4 (Papel Foto)', usd: 2.00, icon: 'camera', category: 'Impresiones Premium', iconClass: 'text-pink-600' },
            { id: 6, name: '8 Fotos Tipo Carnet', usd: 3.00, icon: 'camera', category: 'Impresiones Premium', iconClass: 'text-pink-700' },
            
            // TRÁMITES EN LÍNEA (Con descripciones)
            { id: 44, name: 'Trámites Básicos', description: 'Citas de Cédula (SAIME), Actualización de RIF, Antecedentes Penales y Planillas rápidas.', usd: 3.00, icon: 'globe', category: 'Trámites en Línea', iconClass: 'text-blue-500' },
            { id: 46, name: 'Trámites Complejos', description: 'Citas de Pasaporte, Recuperación de claves/usuarios bloqueados, Creación de correos y Apostillas.', usd: 5.00, icon: 'user-check', category: 'Trámites en Línea', iconClass: 'text-blue-700' },

            // PLASTIFICADOS
            { id: 7, name: 'Plastificado Carnet / Cédula', usd: 0.50, icon: 'shield-check', category: 'Plastificados', iconClass: 'text-gray-700' },
            { id: 8, name: 'Plastificado Carta', usd: 1.50, icon: 'shield-check', category: 'Plastificados', iconClass: 'text-gray-700' },
            { id: 9, name: 'Plastificado Oficio', usd: 2.00, icon: 'shield-check', category: 'Plastificados', iconClass: 'text-gray-700' },

            // ENCUADERNACIONES
            { id: 42, name: 'Encuadernado Básico (Hasta 50 hjs)', usd: 1.50, icon: 'book', category: 'Encuadernaciones', iconClass: 'text-blue-600' },
            { id: 43, name: 'Encuadernado + Portada Plastificada', usd: 2.50, icon: 'book', category: 'Encuadernaciones', iconClass: 'text-blue-800' },
            
            // DISEÑO Y REDACCIÓN
            { id: 36, name: 'Redacción Carta / Permiso (Solo diseño)', usd: 3.00, icon: 'pen-tool', category: 'Diseño y Redacción', iconClass: 'text-emerald-600' },
            { id: 37, name: 'Actualizar CV (Solo diseño)', usd: 5.00, icon: 'layout-template', category: 'Diseño y Redacción', iconClass: 'text-emerald-600' },
            { id: 38, name: 'Creación CV desde cero (Solo diseño)', usd: 10.00, icon: 'layout-template', category: 'Diseño y Redacción', iconClass: 'text-emerald-700' },
            { id: 39, name: 'Diseño Post / Historia (Solo diseño)', usd: 5.00, icon: 'palette', category: 'Diseño y Redacción', iconClass: 'text-emerald-600' },
            { id: 40, name: 'Diseño Básico Tarjeta/Volante', usd: 8.00, icon: 'palette', category: 'Diseño y Redacción', iconClass: 'text-emerald-700' },

            // SOPORTE TÉCNICO
            { id: 25, name: 'Formateo Básico (Sin respaldo)', usd: 15.00, icon: 'monitor', category: 'Soporte Técnico', iconClass: 'text-orange-500' },
            { id: 26, name: 'Formateo Completo (Con respaldo)', usd: 25.00, icon: 'monitor', category: 'Soporte Técnico', iconClass: 'text-orange-600' },
            { id: 10, name: 'Recuperación Datos (Hasta 32GB)', usd: 5.00, icon: 'hard-drive', category: 'Soporte Técnico', iconClass: 'text-orange-400' },
            { id: 12, name: 'Recuperación Datos (Disco Duro)', usd: 15.00, icon: 'hard-drive', category: 'Soporte Técnico', iconClass: 'text-orange-600' },
            { id: 27, name: 'Optimización / PC Lenta', usd: 10.00, icon: 'settings', category: 'Soporte Técnico', iconClass: 'text-gray-600' },
            { id: 28, name: 'Limpieza de Virus + Antivirus', usd: 10.00, icon: 'shield-check', category: 'Soporte Técnico', iconClass: 'text-red-500' },
            { id: 29, name: 'Instalación Programas (Office/Diseño)', usd: 5.00, icon: 'wrench', category: 'Soporte Técnico', iconClass: 'text-gray-700' },
            { id: 30, name: 'Configuración Impresora / Drivers', usd: 5.00, icon: 'printer', category: 'Soporte Técnico', iconClass: 'text-gray-600' },
            { id: 23, name: 'Activación Windows / Licencias', usd: 5.00, icon: 'settings', category: 'Soporte Técnico', iconClass: 'text-gray-500' },
            { id: 31, name: 'Revisión / Otro problema Software', usd: 5.00, icon: 'wrench', category: 'Soporte Técnico', iconClass: 'text-gray-400' },

            // DESCARGAS
            { id: 15, name: 'Descarga de Canción (MP3)', usd: 0.10, icon: 'music', category: 'Descargas Digitales', iconClass: 'text-indigo-500' },
            { id: 16, name: 'Descarga de Video (MP4)', usd: 0.20, icon: 'video', category: 'Descargas Digitales', iconClass: 'text-indigo-500' },
            { id: 17, name: 'Llenado de Memoria (Por 1 GB)', usd: 1.00, icon: 'database', category: 'Descargas Digitales', iconClass: 'text-indigo-600' },

            // PAPELERÍA Y ARTÍCULOS (Agregadas nuevas compras)
            { id: 18, name: 'Funda Protectora (Unidad)', usd: 0.30, icon: 'package', category: 'Papelería y Artículos', iconClass: 'text-teal-500' },
            { id: 19, name: 'Funda Protectora (Promo 2x)', usd: 0.50, icon: 'package', category: 'Papelería y Artículos', iconClass: 'text-teal-600' },
            { id: 41, name: 'Carpeta Marrón (Carta) + Gancho', usd: 1.00, icon: 'folder', category: 'Papelería y Artículos', iconClass: 'text-amber-700', hide: true }, // Ocultamos la genérica
            { id: 49, name: 'Carpeta Marrón (Oficio) + Gancho', usd: 1.00, icon: 'folder', category: 'Papelería y Artículos', iconClass: 'text-amber-800' },
            { id: 50, name: 'Sobre Manila (Carta)', usd: 0.50, icon: 'mail', category: 'Papelería y Artículos', iconClass: 'text-amber-500' },
            { id: 51, name: 'Sobre Manila (Oficio)', usd: 0.60, icon: 'mail', category: 'Papelería y Artículos', iconClass: 'text-amber-600' },
          ]);

          const calculateBs = (usd) => {
            const raw = usd * bcvRate;
            return Math.ceil(raw / 5) * 5;
          };

          const handlePrint = () => {
            setTimeout(() => {
              window.print();
            }, 100);
          };

          const formatCurrency = (value) => {
            return new Intl.NumberFormat('es-VE', {
              style: 'currency',
              currency: 'VES',
              minimumFractionDigits: 2,
            }).format(value);
          };

          // Re-inicializar iconos si cambian los servicios filtrados (poco probable aquí, pero buena práctica)
          useEffect(() => {
             if (window.lucide) {
                 window.lucide.createIcons();
             }
          });

          return (
            <div className="min-h-screen bg-gray-100 p-4 md:p-8 font-sans">
              <style>
                {`
                  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
                  body { font-family: 'Inter', sans-serif; }
                  .bg-brand-blue { background-color: #2B7FFF; }
                  .text-brand-blue { color: #2B7FFF; }
                  .border-brand-blue { border-color: #2B7FFF; }
                  
                  @media print {
                    .no-print { display: none !important; }
                    body { 
                      background-color: white !important; 
                      padding: 0 !important; 
                      margin: 0 !important;
                      -webkit-print-color-adjust: exact !important;
                      print-color-adjust: exact !important;
                    }
                    #printable-poster { 
                      width: 100% !important; 
                      max-width: none !important; 
                      box-shadow: none !important; 
                      margin: 0 !important; 
                      border: none !important; 
                      border-radius: 0 !important;
                      position: absolute;
                      top: 0;
                      left: 0;
                    }
                    @page { margin: 0; size: auto; }
                  }
                `}
              </style>

              {/* PANEL DE CONTROL SUPERIOR */}
              <div className="max-w-4xl mx-auto space-y-6 mb-8 no-print">
                <div className="bg-white rounded-xl shadow-md p-6 border-t-4 border-brand-blue">
                  <div className="flex flex-col md:flex-row md:items-center justify-between gap-6">
                    <div className="flex items-center gap-4">
                      <div className="bg-brand-blue/10 p-3 rounded-full text-brand-blue">
                        <i data-lucide="calculator"></i>
                      </div>
                      <div>
                        <h2 className="text-xl font-black text-gray-800 uppercase tracking-tight">Centro Fotocopiado SS</h2>
                        <p className="text-sm text-gray-500 font-medium">Panel de Gestión de Precios</p>
                      </div>
                    </div>
                    
                    <div className="flex flex-wrap items-center gap-4 bg-gray-50 p-4 rounded-xl border border-gray-100">
                      <div className="flex flex-col">
                        <span className="text-[10px] font-bold text-gray-400 uppercase ml-1 mb-1 flex items-center gap-2">
                          Tasa del día
                          <button onClick={fetchBCVRate} title="Actualizar desde BCV" className="text-brand-blue hover:text-blue-800 transition-colors">
                             <i data-lucide="refresh-cw" width="12" height="12" className={isFetchingRate ? "animate-spin" : ""}></i>
                          </button>
                        </span>
                        <div className="relative">
                          <span className="absolute left-3 top-2 text-gray-400 font-bold">Bs.</span>
                          <input 
                            type="number" step="0.01" value={bcvRate}
                            onChange={(e) => setBcvRate(parseFloat(e.target.value) || 0)}
                            className="pl-10 pr-4 py-2 border-2 border-gray-200 rounded-lg focus:border-brand-blue outline-none w-36 font-black text-brand-blue text-lg"
                          />
                        </div>
                      </div>
                      <button onClick={handlePrint} className="flex items-center gap-2 bg-brand-blue hover:bg-blue-700 text-white font-bold px-6 py-3 rounded-lg shadow-lg active:scale-95 transition-all">
                        <i data-lucide="printer" width="20" height="20"></i>
                        IMPRIMIR
                      </button>
                    </div>
                  </div>
                </div>
              </div>

              {/* CARTEL PRINCIPAL */}
              <div id="printable-poster" className="max-w-4xl mx-auto bg-white shadow-2xl overflow-hidden rounded-3xl border border-gray-100 flex flex-col">
                
                {/* ENCABEZADO */}
                <div className="bg-brand-blue text-white p-8 md:p-10 text-center relative overflow-hidden flex-shrink-0">
                  <div className="absolute top-0 right-0 w-80 h-80 bg-white/10 rounded-full -mr-32 -mt-32 blur-3xl"></div>
                  <div className="absolute bottom-0 left-0 w-64 h-64 bg-blue-400/20 rounded-full -ml-20 -mb-20 blur-2xl"></div>
                  
                  <div className="relative z-10 flex flex-col items-center">
                    {/* LOGO AREA ESTÁTICO */}
                    <div className="flex justify-center mb-6">
                        <img 
                          src={localLogoUrl} 
                          alt="Logo Centro Fotocopiado SS" 
                          onError={(e) => { e.target.style.display = 'none'; console.error("Error al cargar el logo. Verifica que 'PRINTER CENTER (1).png' esté en la misma carpeta."); }}
                          className="h-32 object-contain drop-shadow-2xl bg-white p-3 rounded-2xl"
                        />
                    </div>

                    <h1 className="text-4xl md:text-5xl font-black uppercase tracking-tighter leading-none mb-2 drop-shadow-sm">
                      Centro Fotocopiado SS
                    </h1>
                    <h2 className="text-lg md:text-xl font-bold tracking-[0.25em] uppercase opacity-90 mb-6">
                      Inversiones & Servicios
                    </h2>
                    
                    <div className="inline-flex items-center gap-3 bg-white/20 backdrop-blur-md px-8 py-2.5 rounded-full border border-white/30 shadow-inner">
                      <span className="w-2.5 h-2.5 bg-green-400 rounded-full animate-pulse shadow-[0_0_8px_rgba(74,222,128,0.8)]"></span>
                      <span className="text-sm font-black tracking-widest uppercase">
                        Tasa Hoy: {formatCurrency(bcvRate)}
                      </span>
                    </div>
                  </div>
                </div>

                {/* CUERPO DE PRECIOS */}
                <div className="bg-white p-8 md:p-12 flex-grow">
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-12">
                    {['Impresiones (Papel Normal)', 'Impresiones Premium', 'Trámites en Línea', 'Diseño y Redacción', 'Soporte Técnico', 'Plastificados', 'Encuadernaciones', 'Descargas Digitales', 'Papelería y Artículos'].map((cat) => {
                      const isFullWidth = ['Soporte Técnico', 'Diseño y Redacción', 'Descargas Digitales', 'Papelería y Artículos'].includes(cat);
                      const catServices = services.filter(s => s.category === cat && !s.hide);
                      
                      if (catServices.length === 0) return null;

                      return (
                        <div key={cat} className={isFullWidth ? 'md:col-span-2' : ''}>
                          <div className="flex items-center gap-3 mb-6">
                            <div className="h-10 w-2.5 bg-brand-blue rounded-full"></div>
                            <h3 className="text-2xl font-black text-gray-800 uppercase tracking-tight">
                              {cat}
                            </h3>
                          </div>
                          
                          <div className={`grid grid-cols-1 ${isFullWidth ? 'md:grid-cols-2 gap-x-8' : ''} gap-3`}>
                            {catServices.map((service) => (
                              <div key={service.id} className="flex items-center justify-between p-4 rounded-2xl border-2 border-gray-100 hover:border-brand-blue/30 hover:bg-blue-50/30 transition-all">
                                <div className="flex items-center gap-5">
                                    <div className={`bg-gray-100 p-3.5 rounded-xl ${service.iconClass || 'text-gray-700'}`}>
                                      <i data-lucide={service.icon} width="20" height="20"></i>
                                    </div>
                                    <div>
                                      <p className="font-black text-gray-900 text-lg leading-tight mb-1">{service.name}</p>
                                      {service.description && (
                                        <p className="text-xs text-gray-500 font-medium mb-2 leading-snug max-w-[250px] md:max-w-xs">{service.description}</p>
                                      )}
                                      <div className="flex items-center gap-2">
                                         <span className="bg-brand-blue/10 text-brand-blue text-[10px] px-2.5 py-1 rounded font-black uppercase tracking-wider">Ref. ${service.usd.toFixed(2)}</span>
                                      </div>
                                    </div>
                                  </div>
                                  <div className="text-right flex flex-col items-end min-w-fit ml-4">
                                    <span className="text-3xl font-black text-brand-blue tracking-tighter tabular-nums">
                                      {calculateBs(service.usd).toLocaleString('es-VE')}
                                    </span>
                                    <span className="text-[10px] font-black text-gray-400 uppercase tracking-widest">Bolívares</span>
                                  </div>
                                </div>
                              ))}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* PIE DE PÁGINA */}
                <div className="bg-gray-900 text-white p-12 flex-shrink-0">
                  <div className="flex flex-col md:flex-row justify-between items-center gap-12">
                    <div className="text-center md:text-left flex-1">
                      <h4 className="text-2xl font-black uppercase mb-6 tracking-tight flex items-center justify-center md:justify-start gap-3">
                        <i data-lucide="message-circle" width="32" height="32" className="text-green-400"></i>
                        ¡Contáctanos por WhatsApp!
                      </h4>
                      <div className="space-y-4">
                        <a href={contactInfo.link} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-4 bg-white/10 hover:bg-white/20 p-4 px-6 rounded-2xl border border-white/10 transition-all cursor-pointer no-underline group">
                          <i data-lucide="smartphone" width="28" height="28" className="text-brand-blue group-hover:scale-110 transition-transform"></i>
                          <div className="text-left">
                            <p className="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1">Escríbenos al</p>
                            <p className="text-2xl font-black tracking-tighter">{contactInfo.phone}</p>
                          </div>
                        </a>
                        <p className="text-gray-400 text-sm font-medium">Recibimos tus documentos en línea y los tenemos listos para retirar.</p>
                      </div>
                    </div>

                    {/* QR AREA FIJO */}
                    <div className="bg-white p-5 rounded-3xl shadow-2xl flex flex-col items-center gap-3">
                      <div className="bg-white p-3 rounded-2xl border-4 border-gray-50 flex items-center justify-center relative overflow-hidden">
                        <img 
                          src={localQrUrl} 
                          alt="WhatsApp QR Code Centro Fotocopiado SS"
                          onError={(e) => { e.target.style.display = 'none'; console.error("Error al cargar el QR. Verifica que esté en la misma carpeta."); }} 
                          className="w-32 h-32 md:w-40 md:h-40 object-cover"
                        />
                      </div>
                      <span className="text-[10px] font-black text-gray-400 uppercase tracking-[0.3em]">Escanea y Envía</span>
                    </div>
                  </div>

                  <div className="mt-12 pt-8 border-t border-white/5 flex flex-col md:flex-row justify-between items-center gap-6 text-center">
                    <div className="flex gap-6 items-center">
                       <span className="text-[10px] text-gray-500 font-black uppercase tracking-widest">Calidad Epson</span>
                       <div className="w-1 h-1 bg-gray-700 rounded-full"></div>
                       <span className="text-[10px] text-gray-500 font-black uppercase tracking-widest">Servicio Express</span>
                    </div>
                    <p className="text-[10px] text-gray-600 font-medium max-w-xs md:text-right">
                      Precios calculados según tasa oficial. Montos referenciales.
                    </p>
                  </div>
                </div>
              </div>
            </div>
          );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
